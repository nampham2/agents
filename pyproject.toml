[project]
name = "agents"
version = "0.1.0"
description = "Claude agent skills, plugins, and supporting utilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[build-system]
requires = ["uv-build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agents"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7.1,<8",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.15,<0.16",
    "ty>=0.0.23",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# lib.py is kept in sync with the standalone skill script; long lines and the
# established WorkspaceConflict name are intentional.
"src/agents/workspace/lib.py" = ["E501", "N818"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # PEP8 naming conventions
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
addopts = """
    --durations=10
    --strict-markers
    --basetemp=/tmp/_agents_tests
    --cov=src/agents
    --cov-report=term-missing
"""
testpaths = ["tests"]
console_output_style = "progress"
log_cli = true
log_cli_format = "[%(asctime)s] %(levelname)s [%(name)s.%(funcName)s:%(lineno)d] %(message)s"
log_cli_date_format = "%H:%M:%S"
log_level = "INFO"
asyncio_mode = "auto"
