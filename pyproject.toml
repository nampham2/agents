[project]
name = "agents"
version = "0.4.4"
description = "Cross-host agent skills, plugins, and supporting utilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7.1,<8",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.15,<0.16",
    "ty>=0.0.23",
]

[tool.uv]
default-groups = ["dev"]
# No importable package here: the shipped code is the plugin scripts, run directly by Claude.
package = false

[tool.ty.environment]
# Mirrors the sys.path insert in tests/conftest.py, so the type checker and editors
# resolve the plugin scripts the same way Claude and the tests do.
extra-paths = ["plugins/research/skills/project/scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# workspace_lib.py has long lines and the established WorkspaceConflict name.
"plugins/research/skills/project/scripts/workspace_lib.py" = ["E501", "N818"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # PEP8 naming conventions
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
addopts = """
    --durations=10
    --strict-markers
    --cov=plugins/research/skills/project/scripts
    --cov-report=term-missing
"""
testpaths = ["tests"]
console_output_style = "progress"
log_cli = true
log_cli_format = "[%(asctime)s] %(levelname)s [%(name)s.%(funcName)s:%(lineno)d] %(message)s"
log_cli_date_format = "%H:%M:%S"
log_level = "INFO"
asyncio_mode = "auto"

[tool.coverage.report]
# The suite has covered every shipped statement since commit 7c31331; the gate is what defends the
# claim. Without it a commit can assert full coverage while the number quietly falls.
fail_under = 100
show_missing = true
