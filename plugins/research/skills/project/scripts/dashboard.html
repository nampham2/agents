<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
:root {
  --bg: #ECEFF9; --surface: #FFFFFF; --sunken: #F4F6FD; --ink: #141838; --muted: #555B7F; --line: #D3D9EE; --edge: #7A82A8; --focus: #2D56D6;
  --c-executing: #007A6B; --c-planning: #2D56D6; --c-aligning: #7B3FE4; --c-review: #BE1F6E;
  --c-blocked: #BF3F0A; --c-done: #2B7A2F; --c-cancelled: #5E6578; --c-unreadable: #B3261E;
  --t0: #0B6E99; --t1: #8A4FD6; --t2: #B5541A; --t3: #2F7D4F; --t4: #B0306A; --t5: #5A6BD1; --t6: #8C6A00; --t7: #00796B;
  --shadow: 0 1px 2px rgba(20, 24, 56, .06), 0 8px 24px rgba(20, 24, 56, .06);
  --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --text: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F22; --surface: #161A36; --sunken: #1D2242; --ink: #EEF0FD; --muted: #A5ABD0; --line: #2C3260; --edge: #7F87B8; --focus: #8FB0FF;
    --c-executing: #3FE0C0; --c-planning: #85A8FF; --c-aligning: #BA9BFF; --c-review: #FF86BE;
    --c-blocked: #FF9D5C; --c-done: #72DC7E; --c-cancelled: #9CA3B5; --c-unreadable: #FF7F76;
    --t0: #5CC8F2; --t1: #C39BFF; --t2: #FFA561; --t3: #74D99A; --t4: #FF8DB6; --t5: #93A2FF; --t6: #E4C14D; --t7: #4FD3C4;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F22; --surface: #161A36; --sunken: #1D2242; --ink: #EEF0FD; --muted: #A5ABD0; --line: #2C3260; --edge: #7F87B8; --focus: #8FB0FF;
  --c-executing: #3FE0C0; --c-planning: #85A8FF; --c-aligning: #BA9BFF; --c-review: #FF86BE;
  --c-blocked: #FF9D5C; --c-done: #72DC7E; --c-cancelled: #9CA3B5; --c-unreadable: #FF7F76;
  --t0: #5CC8F2; --t1: #C39BFF; --t2: #FFA561; --t3: #74D99A; --t4: #FF8DB6; --t5: #93A2FF; --t6: #E4C14D; --t7: #4FD3C4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--c-planning); text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.ic { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.s-ALIGNING { --rc: var(--c-aligning); } .s-PLANNING { --rc: var(--c-planning); } .s-EXECUTING { --rc: var(--c-executing); }
.s-REVIEW { --rc: var(--c-review); } .s-BLOCKED { --rc: var(--c-blocked); } .s-DONE { --rc: var(--c-done); }
.s-CANCELLED { --rc: var(--c-cancelled); } .s-UNREADABLE { --rc: var(--c-unreadable); }
.r-blocked { --rc: var(--c-blocked); } .r-authorization { --rc: var(--c-review); } .r-review { --rc: var(--c-aligning); }
.r-waiting { --rc: var(--c-planning); } .r-unreadable { --rc: var(--c-unreadable); }
.stat { color: var(--rc); font-weight: 700; white-space: nowrap; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 72px; }

/* Top bar */
.top { padding: 18px 0 12px; }
.title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: -0.02em; margin: 0; }
.root { color: var(--muted); font-size: 14px; word-break: break-all; flex: 1 1 200px; min-width: 0; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; display: inline-grid; place-items: center; }
.iconbtn:hover { border-color: var(--c-planning); }
.iconbtn .ic { margin: 0; }
.tally { color: var(--muted); font-size: 15px; margin: 6px 0 0; }
.tally b { color: var(--ink); }

/* Filters */
.filters { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; display: grid; gap: 8px; }
.filters-main { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.filters input[type="search"], .filters input[type="date"], .filters select {
  border: 1px solid var(--edge); border-radius: 10px; background: var(--sunken); padding: 8px 10px; min-width: 0;
}
.filters input[type="search"] { flex: 1 1 220px; }
.filters-more { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.filters select { width: 168px; }
.filters input[type="date"] { width: 142px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.status-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.chip { border: 1px solid color-mix(in srgb, var(--rc, var(--line)) 60%, var(--line)); background: color-mix(in srgb, var(--rc, var(--line)) 8%, var(--surface)); border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: 14px; }
.chip .n { margin-left: 5px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .dot { background: var(--bg); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rc); margin-right: 6px; }
.radios { display: inline-flex; gap: 10px; color: var(--muted); font-size: 13px; }
.datefield { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.radios label { display: inline-flex; gap: 6px; align-items: center; }
.linkbtn { background: none; border: 0; padding: 4px; color: var(--c-planning); text-decoration: underline; cursor: pointer; }
.only-narrow { display: none; }
[hidden] { display: none !important; }
.fl { color: var(--muted); font-size: 13px; }
.chip.zero:not([aria-pressed="true"]) { opacity: .55; }
.applied-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.applied-bar .results { color: var(--muted); font-size: 14px; margin-right: 4px; }
.applied-bar .results b { color: var(--ink); }
button.applied { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--edge); background: var(--surface); border-radius: 999px; padding: 3px 8px 3px 12px; cursor: pointer; font-size: 13px; }
button.applied .ic { margin: 0; width: 13px; height: 13px; }
button.applied:hover { border-color: var(--c-unreadable); }

/* Sections */
.section { margin-top: 26px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: -0.01em; margin: 0; }
.count { color: var(--muted); font-size: 15px; }

/* Departures board */
.board { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line); }
.hold { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 18px; align-items: center; padding: 12px 18px 12px 18px; border-top: 1px solid var(--line); border-left: 6px solid var(--rc); cursor: pointer; }
.reason-title { padding: 10px 18px 6px 24px; font-weight: 700; color: var(--rc); background: var(--sunken); border-top: 1px solid var(--line); border-left: 6px solid var(--rc); }
.reason:first-child .reason-title { border-top: 0; }
.hold:hover { background: var(--sunken); }
.hold .what { min-width: 0; }
.hold .pid { color: var(--muted); font-size: 14px; white-space: nowrap; }
.hold .name { display: block; font-weight: 700; line-height: 1.3; }
.hold .sub { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 14px; margin-top: 2px; }
.pid { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline dotted transparent; text-underline-offset: 3px; }
button.pid:hover { color: var(--ink); text-decoration-color: currentColor; }
.idline { display: flex; gap: 12px; align-items: center; }
.rowbtn { background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; font-weight: inherit; overflow-wrap: anywhere; min-width: 0; }
.copybtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.copybtn:hover { border-color: var(--c-planning); color: var(--c-planning); }
.clear-state { padding: 22px 20px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.clear-state .ic { color: var(--c-done); }
.morebar { padding: 10px 18px; border-top: 1px solid var(--line); background: var(--sunken); }

/* Route cards */
.group-title { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; font-weight: 700; color: var(--rc); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card { background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 9%, var(--surface)), var(--surface) 70px); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-shadow: var(--shadow); }
.card:hover { border-color: var(--rc); }
.route { display: flex; align-items: center; height: 22px; }
.route i { display: block; position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--edge); flex: none; }
.route i::before { content: ""; position: absolute; inset: -9px; }
.route i:hover::after { content: attr(data-tip); position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 3px 9px; border-radius: 6px; font-size: 12px; font-style: normal; white-space: nowrap; z-index: 6; pointer-events: none; }
.route i:first-child:hover::after { left: 0; transform: none; }
.route i:last-child:hover::after { left: auto; right: 0; transform: none; }
.route s { display: block; height: 4px; background: var(--line); flex: 1; border-radius: 2px; text-decoration: none; }
.route i.on { background: var(--rc); }
.route s.on { background: var(--rc); }
.route i.cur { width: 18px; height: 18px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--rc) 24%, transparent); }
.route i.hollow { background: var(--surface); border: 3px solid var(--rc); }
.s-EXECUTING .route i.cur { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--rc) 6%, transparent); } }
.card .top-line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); }
.card .pid { white-space: nowrap; }
.card .name { font-weight: 700; font-size: 17px; line-height: 1.3; }
.card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.repo { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.repo::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--tint, var(--t0)); }
.bar { display: inline-flex; align-items: center; gap: 8px; }
.bar i { display: block; width: 72px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i b { display: block; height: 100%; background: var(--rc); }
.gates { display: flex; flex-wrap: wrap; gap: 6px; }
.cardfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.cardfoot .gates { flex: 1 1 0; min-width: 0; }
.cardfoot .copybtn { margin-left: auto; padding: 4px 10px; font-size: 13px; }
.dmeta { color: var(--muted); font-size: 14px; margin-top: 4px; }
.gate { font-size: 13px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--gc, var(--line)); background: color-mix(in srgb, var(--gc, var(--line)) 10%, var(--surface)); }
.g-good { --gc: var(--c-done); } .g-warn { --gc: var(--c-blocked); } .g-neutral { --gc: var(--c-cancelled); }
.waitline { font-size: 14px; color: var(--c-blocked); font-weight: 700; }

/* Archive */
.archive-toggle { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.archive-toggle .ic { margin: 0; transition: transform .15s; }
.archive-toggle[aria-expanded="true"] .ic { transform: rotate(90deg); }
.day { margin-top: 16px; }
.day h3 { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
.past { display: grid; grid-template-columns: 150px minmax(0, 1fr) 24px max-content; gap: 14px; align-items: center; padding: 8px 14px; background: var(--surface); border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.past:first-of-type { border-top: 0; border-radius: 12px 12px 0 0; }
.past:last-of-type { border-radius: 0 0 12px 12px; }
.past:hover { background: var(--sunken); }
.past .pid { color: var(--muted); white-space: nowrap; }
.past .when { color: var(--muted); display: flex; gap: 12px; justify-content: flex-end; white-space: nowrap; }
.past .stat { text-align: center; }

.none { padding: 28px 20px; color: var(--muted); background: var(--surface); border-radius: 14px; border: 1px solid var(--line); }
.notice { margin: 14px 0 0; padding: 10px 14px; background: var(--surface); border-left: 4px solid var(--c-blocked); border-radius: 8px; font-size: 14px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 30, .45); opacity: 0; visibility: hidden; transition: opacity .18s; z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; height: 100vh; height: 100dvh; width: min(540px, 100vw); background: var(--surface); z-index: 21; overflow-y: auto; box-shadow: -12px 0 40px rgba(8, 10, 30, .25); transform: translateX(100%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; border-radius: 20px 0 0 20px; }
body.has-drawer .scrim { opacity: 1; visibility: visible; }
body.has-drawer .drawer { transform: none; visibility: visible; transition: transform .2s ease; }
.drawer-head { position: sticky; top: 0; background: var(--surface); padding: 18px 22px 14px; border-bottom: 4px solid var(--rc); display: flex; gap: 12px; align-items: flex-start; }
.drawer-head .heading { flex: 1; min-width: 0; }
.drawer-head h2 { font-size: 20px; line-height: 1.25; }
.drawer-head .pid { color: var(--muted); font-size: 14px; }
.dbody { padding: 6px 22px 40px; }
.dbody h3 { font-family: var(--display); font-size: 16px; margin: 22px 0 8px; }
.dbody p { margin: 0 0 8px; max-width: 62ch; }
.dbody .mute { color: var(--muted); }
.dbody ul { margin: 0; padding-left: 18px; }
.dbody li { margin-bottom: 4px; }
.dbody table { width: 100%; border-collapse: collapse; font-size: 14px; }
.dbody th, .dbody td { text-align: left; padding: 5px 8px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
.dbody th { border-top: 0; color: var(--muted); font-weight: 400; }
.dbody .donot { border-left: 4px solid var(--c-blocked); padding-left: 10px; }
.dbody .scope { white-space: pre-wrap; font-size: 14px; color: var(--muted); max-height: 170px; overflow: auto; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.sessions { list-style: none; padding: 0; }
.sessions li { padding: 10px 0; border-top: 1px solid var(--line); }
.sessions li:first-child { border-top: 0; }
.sessions .prompt { font-size: 14px; color: var(--muted); margin: 2px 0 6px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 40; }
.toast.show { opacity: 1; }

@media (max-width: 900px) {
  .wrap { padding: 0 14px 64px; }
  .hold { grid-template-columns: minmax(0, 1fr); padding: 12px 14px; gap: 6px; }
  .past { grid-template-columns: minmax(0, 1fr) auto; }
  .past .pid { display: none; }
  .past .when { grid-column: 1 / -1; text-align: left; }
  .drawer { border-radius: 0; }
  .filters-more { display: none; }
  .filters.open .filters-more { display: flex; }
  .only-narrow { display: inline-block; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 24px; }
  .root { display: none; }
}
</style>
</head>
<body>

  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg>
<div class="wrap" id="page">
  <div class="notice" id="notice" role="status" hidden></div>
  <header class="top" id="top">
    <div class="title-row">
      <h1>Research projects</h1>
      <div class="root" id="root"></div>
      <button class="iconbtn" id="theme" aria-label="Switch between light and dark theme" title="Switch theme"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
    </div>
    <p class="tally" id="tally"></p>
    <div class="status-bar"><span class="fl">Status</span><div class="chips" id="status-chips" role="group" aria-label="Filter by status"></div></div>
    <div class="filters" id="filters">
      <div class="filters-main">
        <input type="search" id="q" placeholder="Search id, title or path" aria-label="Search projects">
        <button class="linkbtn only-narrow" id="filters-toggle" aria-expanded="false" aria-controls="filters-more">More filters</button>
      </div>
      <div class="filters-more" id="filters-more">
        <select id="repo" aria-label="Repository"><option value="">All repositories</option></select>
        <label class="datefield">Date since <input type="date" id="from"></label>
        <span class="radios" role="radiogroup" aria-label="Which date the date filter, the order and the ages use"><span>by</span><label><input type="radio" name="field" value="updated" checked> last update</label><label><input type="radio" name="field" value="created"> creation</label></span>
        <button class="linkbtn" id="clear">Clear filters</button>
      </div>
    </div>
    <div class="applied-bar" id="applied" aria-live="polite"></div>
  </header>

  <main id="register">
    <div class="none" id="empty" hidden></div>
    <section class="section" id="band-section" aria-labelledby="band-title">
      <div class="section-head"><h2 id="band-title">Waiting on you</h2><span class="count" id="band-count"></span></div>
      <div id="band"></div>
    </section>
    <section class="section" id="flight-section" aria-labelledby="flight-title">
      <div class="section-head"><h2 id="flight-title">In flight</h2><span class="count" id="flight-count"></span></div>
      <div id="flight"></div>
    </section>
    <section class="section" id="archive-section" aria-labelledby="archive-title">
      <div class="section-head"><h2 id="archive-title">Finished</h2><span class="count" id="archive-count"></span></div>
      <button class="archive-toggle" id="archive-toggle" aria-expanded="false" aria-controls="archive"><svg class="ic" aria-hidden="true"><use href="#i-chev"/></svg><span id="archive-label">Show finished projects</span></button>
      <div id="archive"></div>
    </section>
  </main>
</div>
<div class="scrim" data-close="1"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Project detail" tabindex="-1">
  <div class="drawer-head" id="drawer-head">
    <div class="heading" id="drawer-title"></div>
    <button class="iconbtn" id="drawer-close" data-close="1" aria-label="Close project detail"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="dbody" id="drawer-body"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
let DATA = null;
const RAIL = ["ALIGNING", "PLANNING", "EXECUTING", "REVIEW", "DONE"];
const STAGE_NAME = { ALIGNING: "Aligning", PLANNING: "Planning", EXECUTING: "Executing", REVIEW: "Review", DONE: "Done" };
const ORDER = ["EXECUTING", "BLOCKED", "REVIEW", "PLANNING", "ALIGNING", "DONE", "CANCELLED", "UNREADABLE"];
const FLIGHT_ORDER = ["EXECUTING", "REVIEW", "PLANNING", "ALIGNING"];
const TERMINAL = new Set(["DONE", "CANCELLED"]);
const POLL_MS = 3000;
const BAND_LIMIT = 5;
const state = { statuses: new Set(), from: "", field: "updated", repo: "", q: "", open: new Set(), last: null, focus: null, focusDrawer: false, showAllNeeds: false, archiveOpen: false, filtersOpen: false, hashId: "" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Workspace files are data, not code: only a web address becomes a link.
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "";
const link = (u, text) => safeUrl(u) ? `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${text}</a>` : esc(text);
// A command the reader pastes into a shell: quote every part that is not plainly safe.
const shq = s => /^[\w@%+=:,.\/-]+$/.test(s) ? s : "'" + String(s).replace(/'/g, "'\\''") + "'";
const ic = name => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const STATUS_ICON = { ALIGNING: "compass", PLANNING: "plan", EXECUTING: "play", REVIEW: "eye", BLOCKED: "alert", DONE: "check", CANCELLED: "ban", UNREADABLE: "alert" };
const REASON = {
  blocked: ["Blocked", "alert"], authorization: ["Needs your approval", "key"], review: ["Review is waiting", "eye"],
  waiting: ["Waiting for your reply", "hand"], unreadable: ["project.json is unreadable or has no status", "alert"],
};
const TASK_CLASS = { DONE: "s-DONE", RUNNING: "s-EXECUTING", BLOCKED: "s-BLOCKED", SKIPPED: "s-CANCELLED", TODO: "s-CANCELLED" };
const pick = (map, key) => Object.hasOwn(map, key) ? map[key] : undefined;
const REASON_ORDER = ["unreadable", "blocked", "authorization", "review", "waiting"];
const reasonRank = p => { const i = REASON_ORDER.indexOf(p.needs_you_reason); return i < 0 ? REASON_ORDER.length : i; };
const OUTCOME = { accepted: "good", "accepted-residual": "good", waived: "neutral", open: "warn", "reaudit-required": "warn" };

function rel(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + " d ago";
  return Math.round(s / 86400 / 7) + " wk ago";
}
function exact(iso) { if (!iso) return ""; const d = new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
// The age every list shows follows the date the filters use, and says which date it is.
function stamp(p) { const f = state.field === "created" && p.created ? "created" : "updated"; return `${f} ${rel(p[f] || p.updated)}`; }
function dayKey(p) { return (p[state.field] || p.updated || p.id).slice(0, 10); }
function dayLabel(key) { const d = new Date(key + "T00:00:00"); const y = d.getFullYear() === new Date().getFullYear() ? "" : " " + d.getFullYear(); return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}${y}`; }
// A repository keeps one tint: the sum of its name's code points, modulo eight.
function tint(name) { let n = 0; for (const c of String(name)) n += c.codePointAt(0); return `var(--t${n % 8})`; }
function repoHtml(p) { return p.repo ? `<span class="repo" style="--tint: ${tint(p.repo)}">${esc(p.repo)}</span>` : ""; }
const byMoved = (a, b) => (b[state.field] || "").localeCompare(a[state.field] || "");

// The route: five stations, the project stands on the current one. BLOCKED stands on stage 2 (stage 0 with no tasks).
function routeHtml(p) {
  let idx = RAIL.indexOf(p.status);
  const blocked = p.status === "BLOCKED";
  if (blocked) idx = p.task_total ? 2 : 0;
  const stations = RAIL.map((s, i) => `${STAGE_NAME[s]} ${i === idx ? (blocked ? "blocked here" : "current") : i < idx ? "reached" : "not reached"}`).join(", ");
  let h = `<div class="route" role="img" aria-label="Stage ${esc(p.status.toLowerCase())}. ${stations}">`;
  RAIL.forEach((s, i) => {
    const reached = i <= idx, cur = i === idx;
    const where = cur ? (blocked ? "blocked here" : "current") : reached ? "reached" : "not reached";
    h += `<i class="${reached ? "on" : ""} ${cur ? "cur" : ""} ${cur && blocked ? "hollow" : ""}" data-tip="${STAGE_NAME[s]}: ${where}"></i>`;
    if (i < RAIL.length - 1) h += `<s class="${i < idx ? "on" : ""}"></s>`;
  });
  return h + "</div>";
}
function statusHtml(p) { return `<span class="stat">${ic(pick(STATUS_ICON, p.status) || "alert")}${esc(p.status.toLowerCase())}</span>`; }
function waitText(w) { return w ? `Blocked, waits on ${esc(w.on)}${w.until ? ` until ${esc(w.until)}` : ""}${w.due ? " (due)" : ""}` : ""; }
function firstWait(p) { return (p.tasks || []).map(t => waitText(t.wait)).find(Boolean) || ""; }
function sessionCmd(s) { return s.resume || `${s.cwd ? `cd ${shq(s.cwd)} && ` : ""}claude --resume ${shq(s.id)}`; }
function isOpen(id) { return state.last === id && state.open.has(id); }
function resumePrompt(p) { return `Use the project skill to resume ${p.path}.`; }
function copyBtn(p) { return `<button class="copybtn" data-copy="${esc(resumePrompt(p))}" data-what="resume prompt" title="Copy the prompt that resumes this project" aria-label="Copy resume prompt for ${esc(p.title)}">${ic("copy")}Resume prompt</button>`; }
// The project id copies on click, wherever it is shown.
function pidHtml(p) { return `<button class="pid" data-copy="${esc(p.id)}" data-what="project ID" title="Copy project ID" aria-label="Copy project ID ${esc(p.id)}">${esc(p.id)}</button>`; }

// On a card only a gate that says something is shown; the drawer lists every gate.
function gatesHtml(p, compact) {
  const out = [];
  if (p.agreement === "agreed") out.push(`<span class="gate g-good">Plan agreed</span>`);
  else if (p.agreement === "draft") out.push(`<span class="gate g-warn">Plan in draft</span>`);
  else if (!compact) out.push(`<span class="gate g-neutral">No plan yet</span>`);
  const g = p.goldfish || { rounds: 0, last_outcome: "" };
  if (g.rounds) out.push(`<span class="gate g-${pick(OUTCOME, g.last_outcome) || "neutral"}">Goldfish ${esc(g.last_outcome || "round " + g.rounds)} (${g.rounds})</span>`);
  else if (!compact) out.push(`<span class="gate g-neutral">No review</span>`);
  if (p.review_required && p.review !== "not_required") out.push(`<span class="gate g-${p.review === "pending" ? "warn" : "good"}">Delivery review ${esc(p.review)}</span>`);
  return out.join("");
}
function progressHtml(p) {
  if (!p.task_total) return `<span>No tasks yet</span>`;
  const pct = Math.round(100 * p.task_done / p.task_total);
  return `<span class="bar"><i><b style="width: ${pct}%"></b></i>${p.task_done} of ${p.task_total} tasks</span>`;
}
function unreadableHtml(p) {
  return `<article class="hold r-unreadable" data-id="${esc(p.id)}">
    <div class="what"><button class="rowbtn name" aria-expanded="${isOpen(p.id)}">${esc(p.title)}</button><div class="sub">${pidHtml(p)}</div></div>
    <div><button class="copybtn" data-copy="${esc(p.path)}">${ic("copy")}Copy project path</button></div></article>`;
}
function holdHtml(p) {
  if (p.unreadable) return unreadableHtml(p);
  const wait = firstWait(p);
  return `<article class="hold r-${esc(p.needs_you_reason)}" data-id="${esc(p.id)}">
    <div class="what"><button class="rowbtn name" aria-expanded="${isOpen(p.id)}">${esc(p.title)}</button>
      <div class="sub">${pidHtml(p)}${repoHtml(p)}<span>${ic("clock")}${esc(stamp(p))}</span>${p.task_total ? `<span>${p.task_done} of ${p.task_total} tasks</span>` : ""}${wait ? `<span>${wait}</span>` : ""}</div></div>
    <div>${copyBtn(p)}</div></article>`;
}
function cardHtml(p) {
  const wait = firstWait(p);
  return `<article class="card s-${esc(p.status)}" data-id="${esc(p.id)}">
    ${routeHtml(p)}
    <div class="top-line">${pidHtml(p)}<span title="${esc(p[state.field] || p.updated)}">${esc(stamp(p))}</span></div>
    <button class="rowbtn name" aria-expanded="${isOpen(p.id)}">${esc(p.title)}</button>
    <div class="meta">${repoHtml(p)}${progressHtml(p)}</div>
    ${wait ? `<div class="waitline">${wait}</div>` : ""}
    <div class="cardfoot">${gatesHtml(p, true) ? `<div class="gates">${gatesHtml(p, true)}</div>` : ""}${copyBtn(p)}</div></article>`;
}
function pastHtml(p) {
  return `<article class="past s-${esc(p.status)}" data-id="${esc(p.id)}">
    ${pidHtml(p)}
    <button class="rowbtn name" aria-expanded="${isOpen(p.id)}">${esc(p.title)}</button>
    ${p.status === "DONE" ? `<span class="stat" role="img" aria-label="done" title="done">${ic("check")}</span>` : statusHtml(p)}<span class="when">${repoHtml(p)} ${esc(stamp(p))}</span></article>`;
}

function sessionHtml(s, i) {
  const live = s.running === "busy" ? `<span class="stat s-EXECUTING">${ic("play")}running now</span>` : s.running ? `<span class="stat s-PLANNING">${ic("play")}open</span>` : "";
  const tag = s.exact ? "recorded" : i === 0 ? "latest" : "";
  const facts = [s.last ? `active ${rel(s.last)}` : "", s.mentions ? `named ${s.mentions} times` : "", s.cwd ? `in ${s.cwd.split("/").pop()}` : ""].filter(Boolean).join(", ");
  const host = s.host === "pi" ? "Pi" : s.host === "claude" ? "Claude" : "";
  const cmd = sessionCmd(s);
  return `<li><div><b>${esc(s.id.slice(0, 8))}</b> ${live} <span class="mute">${esc([tag, host, facts].filter(Boolean).join(", "))}</span></div>
    ${s.prompt ? `<div class="prompt">"${esc(s.prompt)}"</div>` : ""}
    <button class="copybtn" data-copy="${esc(cmd)}" data-what="resume command" title="Copy the command that resumes this session">${ic("copy")}Resume command</button></li>`;
}

function drawerParts(p) {
  const rail = `<div class="s-${esc(p.status)}" style="margin-top: 8px">${routeHtml(p)}</div>`;
  if (p.unreadable) {
    return { head: `<div>${pidHtml(p)}</div><h2>${esc(p.title)}</h2>`, rc: "var(--c-unreadable)",
      body: `<h3>This project cannot be read</h3><p>project.json is missing, malformed or has no status. Path: ${esc(p.path)}</p><div class="btnrow"><button class="copybtn" data-copy="${esc(p.path)}">${ic("copy")}Copy project path</button></div>` };
  }
  const [label] = pick(REASON, p.needs_you_reason) || [""];
  const tasks = p.tasks.length ? `<table><tr><th>Task</th><th>Name</th><th>Status</th><th>Effect</th><th>Evidence</th><th>Receipts</th></tr>${p.tasks.map(t => `<tr><td>${esc(t.id)}</td><td>${esc(t.name)}${t.block_reason ? `<br><span class="mute">${esc(t.block_reason)}</span>` : ""}</td><td><span class="${pick(TASK_CLASS, t.status) || ""}"><span class="stat">${esc(t.status.toLowerCase())}</span></span>${waitText(t.wait) ? `<br><span class="mute">${waitText(t.wait)}</span>` : ""}</td><td>${esc(t.effect)}</td><td>${t.evidence}</td><td>${t.receipts}</td></tr>`).join("")}</table>` : `<p class="mute">No tasks yet.</p>`;
  const waits = (p.tasks || []).map(t => waitText(t.wait) ? `<li>${esc(t.id)}: ${waitText(t.wait)}</li>` : "").join("");
  const blocks = (p.block_reasons || []).map(b => `<li>${esc(b)}</li>`).join("");
  const wts = (p.worktrees || []).map(w => `<li>${ic("branch")}${esc(w.branch)} <span class="mute">(${esc(w.status)})</span><br><span class="mute">${esc(w.path)}</span>${w.mr ? `<br>${link(w.mr, w.mr)}` : ""}</li>`).join("");
  const active = (p.worktrees || []).filter(w => w.status === "active");
  const sessions = (p.sessions || []).length ? `<ul class="sessions">${p.sessions.map(sessionHtml).join("")}</ul>` : `<p class="mute">No agent session found for this project.</p>`;
  const files = ["spec.md", p.planning_file || "planning.md", "handoff.md", "evidence.md"].map(f => `<button class="copybtn" data-copy="${esc(p.path + "/" + f)}">${ic("file")}${f}</button>`).join("");
  const g = p.goldfish || { rounds: 0, last_outcome: "" };
  const body = `
    <h3>Phase and gates</h3>
    ${rail}
    ${p.running && p.running.length ? `<p style="margin-top: 10px"><span class="stat s-EXECUTING">${ic("play")}</span>Running ${esc(p.running.join(", "))}</p>` : ""}
    <div class="gates" style="margin-top: 10px">${gatesHtml(p)}</div>
    ${label ? `<p style="margin-top: 10px"><span class="stat r-${esc(p.needs_you_reason)}">${ic((pick(REASON, p.needs_you_reason) || ["", "hand"])[1])}${esc(label)}</span></p>` : ""}
    <h3>Next</h3>
    ${p.has_handoff ? `<p>${esc(p.next) || '<span class="mute">Not written.</span>'}</p>
      ${p.do_not ? `<p class="donot">${esc(p.do_not)}</p>` : ""}
      ${p.questions ? `<h3>Open questions</h3><p>${esc(p.questions)}</p>` : ""}` : `<p class="mute">No continuation note for this project.</p>`}
    ${blocks || waits || p.cancellation_reason ? `<h3>Blockers and waits</h3><ul>${blocks}${waits}${p.cancellation_reason ? `<li>Cancelled: ${esc(p.cancellation_reason)}</li>` : ""}</ul>` : ""}
    <h3>Tasks</h3>${tasks}
    <h3>Counts</h3>
    <dl class="facts"><dt>Tasks done</dt><dd>${p.task_done} of ${p.task_total}</dd><dt>Evidence records</dt><dd>${p.evidence_count}</dd><dt>Receipts</dt><dd>${p.receipt_count}</dd><dt>Goldfish rounds</dt><dd>${g.rounds}${g.last_outcome ? `, last ${esc(g.last_outcome)}` : ""}</dd></dl>
    <h3>Objective</h3><p>${esc(p.objective) || '<span class="mute">Not written yet.</span>'}</p>
    ${p.in_scope ? `<h3>In scope</h3><div class="scope">${esc(p.in_scope)}</div>` : ""}
    <h3>Recent decisions</h3>${p.decisions.length ? `<ul>${p.decisions.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : `<p class="mute">None recorded.</p>`}
    ${wts ? `<h3>Delivery</h3><ul>${wts}</ul>` : ""}
    <h3>Agent sessions</h3>${sessions}
    <h3>Copy</h3><div class="btnrow">
      ${copyBtn(p)}
      <button class="copybtn" data-copy="${esc(p.path)}" data-what="project path">${ic("copy")}Project path</button>
      ${active.map(w => `<button class="copybtn" data-copy="${esc(w.path)}">${ic("copy")}Worktree path</button>${safeUrl(w.mr) ? `<button class="copybtn" data-copy="${esc(safeUrl(w.mr))}">${ic("copy")}Merge request link</button>` : ""}`).join("")}
    </div>
    <h3>Files</h3><div class="btnrow">${files}</div>`;
  return { head: `<div class="idline">${pidHtml(p)} ${statusHtml(p)}</div><h2>${esc(p.title)}</h2><div class="dmeta">${repoHtml(p)} moved ${esc(exact(p.updated))}, created ${esc(exact(p.created))}</div>`, rc: `var(--c-${p.status.toLowerCase()})`, body };
}

// Every filter except status: status is applied after it, so the status chips can show what each would add.
function matchesBase(p) {
  if (state.from && (p[state.field] || "") < state.from) return false;
  if (state.repo && p.repo !== state.repo) return false;
  if (state.q) { const q = state.q.toLowerCase(); if (![p.id, p.title, p.working_directory].some(v => (v || "").toLowerCase().includes(q))) return false; }
  return true;
}
function isFiltered() { return Boolean(state.statuses.size || state.q || state.repo || state.from); }
const FIELD_NAME = { updated: "last update", created: "creation" };
function appliedFilters() {
  // A chosen status is already shown pressed in the status bar, so it is not listed twice.
  const out = [];
  if (state.repo) out.push(["repo", `Repository: ${state.repo}`]);
  if (state.from) out.push(["from", `Since ${state.from} by ${FIELD_NAME[state.field] || state.field}`]);
  if (state.q) out.push(["q", `Search: "${state.q}"`]);
  return out;
}
function removeFilter(key) {
  if (key === "repo") { state.repo = ""; document.getElementById("repo").value = ""; }
  else if (key === "from") { state.from = ""; document.getElementById("from").value = ""; }
  else if (key === "q") { state.q = ""; document.getElementById("q").value = ""; }
  render();
}
function clearFilters() {
  Object.assign(state, { from: "", repo: "", q: "" });
  state.statuses.clear();
  for (const id of ["from", "repo", "q"]) document.getElementById(id).value = "";
  render();
}

function bandHtml(band) {
  if (!band.length) return `<div class="board"><div class="clear-state">${ic("check")}Nothing is waiting on you.</div></div>`;
  const shown = state.showAllNeeds ? band : band.slice(0, BAND_LIMIT);
  const groups = new Map();
  shown.forEach(p => { const r = p.needs_you_reason; if (!groups.has(r)) groups.set(r, []); groups.get(r).push(p); });
  // The reason is said once per group, not once per row.
  const parts = [...groups].map(([r, rows]) => { const [label, icon] = pick(REASON, r) || ["Waiting", "hand"]; return `<div class="reason r-${esc(r)}"><div class="reason-title">${ic(icon)}${esc(label)}</div>${rows.map(holdHtml).join("")}</div>`; });
  // Rows hidden by the cap may belong to groups that are not shown at all: say so.
  const hidden = new Map();
  band.slice(shown.length).forEach(p => { if (!groups.has(p.needs_you_reason)) hidden.set(p.needs_you_reason, (hidden.get(p.needs_you_reason) || 0) + 1); });
  const SHORT = { unreadable: "unreadable", blocked: "blocked", authorization: "needs approval", review: "review waiting", waiting: "waiting" };
  const alsoIn = [...hidden].map(([r, n]) => `${pick(SHORT, r) || r} ${n}`).join(", ");
  const more = band.length > BAND_LIMIT ? `<div class="morebar"><button class="linkbtn" data-more="1">${state.showAllNeeds ? "Show fewer" : `Show all ${band.length}${alsoIn ? ` (also: ${alsoIn})` : ""}`}</button></div>` : "";
  return `<div class="board">${parts.join("")}${more}</div>`;
}
function flightHtml(flight) {
  if (!flight.length) return `<div class="none">No project is in flight.</div>`;
  const groups = new Map();
  flight.forEach(p => { if (!groups.has(p.status)) groups.set(p.status, []); groups.get(p.status).push(p); });
  const keys = [...FLIGHT_ORDER.filter(s => groups.has(s)), ...[...groups.keys()].filter(s => !FLIGHT_ORDER.includes(s))];
  return keys.map(s => `<div class="s-${esc(s)}"><div class="group-title">${ic(pick(STATUS_ICON, s) || "alert")}${esc(s.toLowerCase())}</div><div class="cards">${groups.get(s).sort(byMoved).map(cardHtml).join("")}</div></div>`).join("");
}
function archiveHtml(archive) {
  const groups = new Map();
  archive.forEach(p => { const k = dayKey(p); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
  return [...groups.keys()].sort().reverse().map(k => `<div class="day"><h3>${esc(dayLabel(k))}</h3>${groups.get(k).sort(byMoved).map(pastHtml).join("")}</div>`).join("");
}

const FOCUS_REGIONS = ["band", "flight", "archive", "empty", "status-chips", "applied", "drawer-body"];
const CONTROLS = "button, a, input, select";
// Writing identical markup would drop focus and any text selection, so an unchanged region is left alone.
// Only setHtml writes these regions: a direct write would leave the cache stale and a later identical write would be skipped.
function setHtml(el, html) { if (el.__html === html) return; el.innerHTML = html; el.__html = html; }
function rememberFocus() {
  const active = document.activeElement;
  for (const id of FOCUS_REGIONS) {
    const region = document.getElementById(id);
    if (region && region.contains(active)) return { id, index: [...region.querySelectorAll(CONTROLS)].indexOf(active) };
  }
  return null;
}
function restoreFocus(kept) {
  if (!kept || kept.index < 0 || document.contains(document.activeElement) && document.activeElement !== document.body) return;
  const control = document.getElementById(kept.id)?.querySelectorAll(CONTROLS)[kept.index];
  // Removing the last filter or clearing the empty message deletes the focused control: those two go to the search box.
  (control || (kept.id === "applied" || kept.id === "empty" ? document.getElementById("q") : null))?.focus({ preventScroll: true });
}

function render() {
  const get = id => document.getElementById(id);
  if (!DATA) { get("band").innerHTML = `<div class="none">Loading projects.</div>`; return; }
  const kept = rememberFocus();
  const all = DATA.projects;
  get("root").textContent = DATA.root;
  if (!all.length) {
    get("tally").textContent = "";
    for (const id of ["band-count", "flight-count", "archive-count"]) get(id).textContent = "";
    setHtml(get("applied"), "");
    setHtml(get("status-chips"), "");
    setHtml(get("empty"), "");
    get("empty").hidden = true;
    // Nothing to list: only the root's message stays. The user's filters are kept for when projects return.
    get("band-section").hidden = false;
    for (const id of ["flight-section", "archive-section"]) get(id).hidden = true;
    get("archive-toggle").hidden = true;
    for (const id of ["band", "flight", "archive"]) setHtml(get(id), id === "band" ? `<div class="none">No projects under ${esc(DATA.root)}.</div>` : "");
    // With nothing to show there is no drawer: close it and give the page back.
    state.open.clear(); state.last = null; state.focus = null; state.focusDrawer = false;
    document.body.classList.remove("has-drawer");
    for (const id of ["top", "register"]) get(id).inert = false;
    get("drawer").setAttribute("aria-hidden", "true");
    return;
  }
  const needsAll = all.filter(p => p.needs_you_reason);
  const quiet = all.filter(p => !p.needs_you_reason && !TERMINAL.has(p.status));
  const finishedAll = all.filter(p => !p.needs_you_reason && TERMINAL.has(p.status));
  const latest = all.map(p => p.updated || "").sort().pop();
  get("tally").innerHTML = `<b>${all.length}</b> projects. Last movement ${esc(rel(latest))}.`;
  // One result set feeds every section. A section that cannot hold a match disappears while a filter is on.
  const filtered = isFiltered();
  const base = all.filter(matchesBase);
  const shown = state.statuses.size ? base.filter(p => state.statuses.has(p.status)) : base;
  // The band is ordered by how much the reason blocks (an unreadable project first), then newest first.
  const band = shown.filter(p => p.needs_you_reason).sort((a, b) => reasonRank(a) - reasonRank(b) || byMoved(a, b));
  const flight = shown.filter(p => !p.needs_you_reason && !TERMINAL.has(p.status));
  const archive = shown.filter(p => !p.needs_you_reason && TERMINAL.has(p.status));
  const nothing = filtered && !shown.length;
  get("empty").hidden = !nothing;
  setHtml(get("empty"), nothing ? `No project matches these filters. Unpress a status chip, remove a filter with the buttons under the filters, or <button class="linkbtn" data-clearall="1">clear them all</button>.` : "");
  get("band-section").hidden = filtered && !band.length;
  get("flight-section").hidden = filtered && !flight.length;
  get("archive-section").hidden = filtered && !archive.length;
  get("band-count").textContent = filtered ? `${band.length} of ${needsAll.length}` : String(needsAll.length);
  get("flight-count").textContent = filtered ? `${flight.length} of ${quiet.length}` : String(quiet.length);
  get("archive-count").textContent = filtered ? `${archive.length} of ${finishedAll.length}` : String(finishedAll.length);
  setHtml(get("band"), bandHtml(band));
  setHtml(get("flight"), flightHtml(flight));
  // A finished-status filter or a search that matches a finished project opens the archive and the toggle cannot close it.
  const forced = Boolean([...state.statuses].some(s => TERMINAL.has(s)) || (state.q && archive.length > 0));
  const expanded = state.archiveOpen || forced;
  const toggle = get("archive-toggle");
  toggle.setAttribute("aria-expanded", String(expanded));
  // When a filter already opens the archive there is nothing to toggle, so the toggle goes away.
  toggle.hidden = forced;
  get("archive-label").textContent = expanded ? "Hide finished projects" : `Show finished projects (${filtered ? `${archive.length} matching` : finishedAll.length})`;
  setHtml(get("archive"), expanded ? (archive.length ? archiveHtml(archive) : `<div class="none">No finished project matches these filters.</div>`) : "");

  // What is on, and how much it leaves.
  const applied = appliedFilters();
  setHtml(get("applied"), filtered ? `<span class="results">Showing <b>${shown.length}</b> of ${all.length} projects</span>` + applied.map(([key, label]) => `<button class="applied" data-remove="${esc(key)}" aria-label="Remove filter: ${esc(label)}">${esc(label)}${ic("x")}</button>`).join("") : "");

  // Status chips count what each status would show under the other filters.
  const byStatus = {}; all.forEach(p => byStatus[p.status] = (byStatus[p.status] || 0) + 1);
  const facet = {}; base.forEach(p => facet[p.status] = (facet[p.status] || 0) + 1);
  setHtml(get("status-chips"), ORDER.filter(s => byStatus[s]).map(s => `<button class="chip s-${s}${facet[s] ? "" : " zero"}" data-status="${s}" aria-pressed="${state.statuses.has(s)}"><span class="dot"></span>${s.toLowerCase()}<span class="n">${facet[s] || 0}</span></button>`).join(""));
  const repos = [...new Set(all.map(p => p.repo).filter(Boolean))].sort();
  const select = get("repo");
  if (select.dataset.key !== repos.join("\n")) {
    select.innerHTML = `<option value="">All repositories</option>` + repos.map(r => `<option>${esc(r)}</option>`).join("");
    select.dataset.key = repos.join("\n");
    select.value = state.repo;
    state.repo = select.value;
  }
  get("filters").classList.toggle("open", state.filtersOpen);
  get("filters-toggle").setAttribute("aria-expanded", String(state.filtersOpen));
  const active = (state.repo ? 1 : 0) + (state.from ? 1 : 0);
  get("filters-toggle").textContent = active ? `More filters (${active})` : "More filters";

  const current = state.last && state.open.has(state.last) ? all.find(p => p.id === state.last) : null;
  if (!current) { state.open.clear(); state.last = null; }
  document.body.classList.toggle("has-drawer", Boolean(current));
  // The drawer is modal: the header and the list behind it cannot take focus while it is open.
  for (const id of ["top", "register"]) get(id).inert = Boolean(current);
  if (current) {
    const parts = drawerParts(current);
    setHtml(get("drawer-title"), parts.head);
    get("drawer-head").style.setProperty("--rc", parts.rc);
    setHtml(get("drawer-body"), parts.body);
    get("drawer").setAttribute("aria-hidden", "false");
  } else {
    get("drawer").setAttribute("aria-hidden", "true");
  }
  if (state.focusDrawer && current) { get("drawer-close").focus({ preventScroll: true }); state.focusDrawer = false; state.focus = null; }
  else if (state.focus) {
    const target = [...document.querySelectorAll("[data-id]")].find(r => r.dataset.id === state.focus);
    (target?.querySelector(".rowbtn") || get("q")).focus({ preventScroll: true });
    state.focus = null;
  } else restoreFocus(kept);
}

function setStatus(kind, detail) {
  const notice = document.getElementById("notice");
  notice.textContent = kind === "offline" ? `Server not reachable. Restart research-dashboard. Showing data from ${exact(DATA.generated)}.`
    : kind === "error" ? `Could not load projects: ${detail}. Retrying.` : "";
  notice.hidden = !notice.textContent;
}
async function getJson(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) throw new Error(`${path} answered ${response.status}`);
  return response.json();
}
async function load() {
  DATA = await getJson("/api/projects");
  // A project id in the address opens its detail, when a project has that id; it is never written back.
  if (state.hashId) {
    if (DATA.projects.some(p => p.id === state.hashId)) { state.open.add(state.hashId); state.last = state.hashId; state.focusDrawer = true; }
    state.hashId = "";
  }
  render();
}
async function tick() {
  try {
    const version = await getJson("/api/version");
    if (!DATA || version.fingerprint !== DATA.fingerprint) await load();
    setStatus("live");
  } catch (error) {
    setStatus(DATA ? "offline" : "error", error.message);
  }
  setTimeout(tick, POLL_MS);
}

function toast(message) { const t = document.getElementById("toast"); t.textContent = message; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1400); }
function closeDrawer() { if (!state.open.size) return; state.focus = state.last; state.open.clear(); state.last = null; render(); }
function toggleProject(id) {
  if (state.open.has(id) && state.last === id) return closeDrawer();
  state.open.clear();
  state.open.add(id);
  state.last = id;
  state.focus = id;
  state.focusDrawer = true;
  render();
  // Sessions change without any project file changing: look again when a project opens.
  load().catch(() => {});
}
function setTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("research-dashboard-theme", root.dataset.theme); } catch (error) { /* a private window keeps the choice for this page only */ }
  paintThemeButton();
}
function paintThemeButton() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.getElementById("theme").innerHTML = ic(dark ? "sun" : "moon");
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (chip) { const s = chip.dataset.status; state.statuses.has(s) ? state.statuses.delete(s) : state.statuses.add(s); return render(); }
  const copy = e.target.closest("[data-copy]");
  if (copy) { navigator.clipboard.writeText(copy.dataset.copy).then(() => toast(copy.dataset.what ? `Copied ${copy.dataset.what}` : "Copied"), () => toast("Copy failed")); return; }
  if (e.target.closest("[data-close]")) { if (e.detail > 1 && e.target.closest(".scrim")) return; return closeDrawer(); }
  const removal = e.target.closest("[data-remove]"); if (removal) return removeFilter(removal.dataset.remove);
  if (e.target.closest("[data-clearall]")) return clearFilters();
  if (e.target.closest("[data-more]")) { state.showAllNeeds = !state.showAllNeeds; return render(); }
  if (e.target.closest("#archive-toggle")) { state.archiveOpen = !state.archiveOpen; return render(); }
  if (e.target.closest("#filters-toggle")) { state.filtersOpen = !state.filtersOpen; return render(); }
  if (e.target.closest("#theme")) return setTheme();
  if (e.target.closest("#drawer") || e.target.closest("a")) return;
  const row = e.target.closest("[data-id]");
  // A mouse drag that selected text is not a click on the project; a keyboard click (detail 0) always opens it.
  if (row && !(e.detail > 0 && String(getSelection()).length)) toggleProject(row.dataset.id);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
document.getElementById("from").addEventListener("input", e => { state.from = e.target.value; render(); });
document.querySelectorAll("input[name=field]").forEach(r => r.addEventListener("change", e => { state.field = e.target.value; render(); }));
document.getElementById("repo").addEventListener("change", e => { state.repo = e.target.value; render(); });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
document.getElementById("clear").addEventListener("click", clearFilters);
try { const saved = localStorage.getItem("research-dashboard-theme"); if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved; } catch (error) { /* no stored choice: follow the system */ }
paintThemeButton();
try { if (location.hash) state.hashId = decodeURIComponent(location.hash.slice(1)); } catch (error) { /* a malformed address opens nothing */ }
render();
tick();
// Relative times ("5 min ago") age on their own.
setInterval(() => { if (DATA) render(); }, 60000);
</script>
</body>
</html>
