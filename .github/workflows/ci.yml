name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version, unlike the actions above: astral-sh stopped publishing moving
      # major tags after v7, so `@v10` does not resolve to anything and only `@v10.0.1` does.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      # Keep the repository release and every host-specific plugin manifest in lockstep. Run this
      # separately so version drift has a named, immediate failure instead of hiding in the suite.
      - name: Version consistency
        run: uv run pytest -q --no-cov tests/plugins/research/test_plugin_versions.py

      # Lint and type-check everything, tests included: the shipped code lives under
      # plugins/, and scoping these narrower than the repo is what let two copies of
      # the library drift apart unnoticed.
      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check .

      - name: Test
        run: uv run pytest
        env:
          # Tests that create repositories must not inherit a developer or runner Git identity.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"

  python39-compat:
    # SKILL.md tells Claude to run the scripts with plain `python3`, which on many
    # machines is still 3.9. The dev toolchain needs >=3.11, but the shipped scripts
    # must keep importing and running on 3.9 — this job is what enforces that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Smoke-test the shipped scripts on Python 3.9
        working-directory: plugins/research/skills/project/scripts
        run: |
          python -c "import workspace_lib"
          workdir="$(mktemp -d)"
          # init refuses to create a workspace root implicitly, so a fresh root is explicit here and
          # resolution from the environment is exercised in the same breath.
          project="$(python manage_workspace.py init "$workdir/ws" --create-root \
            --title "CI smoke" --working-directory "$workdir")"
          python validate_workspace.py "$project"
          RESEARCH_WORKSPACE="$workdir/ws" python manage_workspace.py rebuild-index
          # show-graph renders text a user reads, so importing the module is not enough. The project
          # above is fresh and has no tasks, so this reaches the dispatch and the empty-plan render
          # rather than the table; the table's 3.9 output is compared against the dev interpreter's,
          # byte for byte, over every real project by tasks/check_python39_floor.py in 2026-09-10-003.
          python manage_workspace.py show-graph "$project"
